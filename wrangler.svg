<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <title>Wrangler</title>
  <!-- lasso rope -->
  <g fill="none" stroke="#C8923C" stroke-width="2.4" stroke-linecap="round">
    <ellipse cx="44" cy="10" rx="15" ry="6.5" transform="rotate(-12 44 10)"/>
    <path d="M33 14 C 38 20, 44 22, 49 24"/>
  </g>
  <!-- legs -->
  <g stroke="#E8541E" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M18 42 L10 47 L8 54"/>
    <path d="M20 45 L14 52 L14 58"/>
    <path d="M46 42 L54 47 L56 54"/>
    <path d="M44 45 L50 52 L50 58"/>
  </g>
  <!-- left arm + claw -->
  <path d="M18 36 C 13 33, 10 29, 10 24" fill="none" stroke="#E8541E" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 25 C 3 24, 2 14, 8 12 C 9 17, 12 18, 14 17 C 15 21, 13 25, 10 25 Z" fill="#F38020"/>
  <!-- right arm + claw holding rope -->
  <path d="M46 36 C 50 32, 51 28, 50 25" fill="none" stroke="#E8541E" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 26 C 57 25, 59 17, 54 14 C 52 18, 49 19, 47 18 C 45 21, 47 26, 50 26 Z" fill="#F38020"/>
  <!-- body -->
  <ellipse cx="32" cy="40" rx="17" ry="11" fill="#F38020"/>
  <ellipse cx="32" cy="37" rx="12" ry="5" fill="#FBAD41" opacity="0.55"/>
  <!-- eye stalks -->
  <g stroke="#E8541E" stroke-width="2.2" stroke-linecap="round">
    <line x1="27" y1="31" x2="26" y2="25"/>
    <line x1="37" y1="31" x2="38" y2="25"/>
  </g>
  <circle cx="26" cy="23.5" r="3.4" fill="#fff" stroke="#E8541E" stroke-width="1.4"/>
  <circle cx="38" cy="23.5" r="3.4" fill="#fff" stroke="#E8541E" stroke-width="1.4"/>
  <circle cx="26.6" cy="23.8" r="1.7" fill="#222"/>
  <circle cx="38.6" cy="23.8" r="1.7" fill="#222"/>
  <!-- smile -->
  <path d="M28 43 Q 32 46.5 36 43" fill="none" stroke="#9A3412" stroke-width="1.8" stroke-linecap="round"/>
</svg>
